  /admin/categories/{id}:
    delete:
      description: Menghapus kategori aplikasi (Admin)
      parameters:
      - description: ID Kategori
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Hapus kategori
      tags:
      - Admin - Catalog
    put:
      consumes:
      - application/json
      description: Memperbarui nama, deskripsi, ikon, atau warna kategori (Admin)
      parameters:
      - description: ID Kategori
        in: path
        name: id
        required: true
        type: integer
      - description: Data perubahan kategori
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/usecase.CategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Perbarui kategori
      tags:
      - Admin - Catalog
  /admin/feedbacks:
    get:
      description: Mengambil seluruh tiket laporan kendala, saran, dan pertanyaan
        pengguna (Admin)
      parameters:
      - description: Filter status tiket (pending, in_progress, resolved, closed)
        in: query
        name: status
        type: string
      - description: Filter ID aplikasi
        in: query
        name: app_id
        type: integer
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 20)
