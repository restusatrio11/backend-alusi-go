      responses:
        "200":
          description: text/event-stream data stream
          schema:
            type: string
      summary: Realtime Server-Sent Events (SSE) Stream Status Layanan
      tags:
      - Monitoring
  /services/status:
    get:
      description: Mengambil status operasional, SLA uptime persentase, dan latensi
