          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Ubah urutan (Drag & Drop) aplikasi
      tags:
      - Admin - Catalog
  /admin/audit-logs:
    get:
      description: Mengambil log aktivitas operasional, perubahan data, dan akses
        administrator (Admin)
      parameters:
      - description: Filter ID pengguna/admin
        in: query
        name: user_id
        type: integer
      - description: Filter aksi (CREATE, UPDATE, DELETE, PROBE)
        in: query
        name: action
        type: string
      - description: Filter entitas target (app, category, guide, announcement)
        in: query
        name: entity
        type: string
      - description: Filter ID entitas spesifik
        in: query
        name: entity_id
        type: string
      - description: Filter tanggal awal (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter tanggal akhir (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah item per halaman (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
