      - description: Authorization code dari SSO
        in: query
        name: code
        required: true
        type: string
      - description: State token proteksi CSRF
        in: query
        name: state
        type: string
      - description: Set ke 'json' untuk mendapatkan JSON token langsung
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: OAuth2 / SSO Callback handler
      tags:
      - Auth
  /auth/login:
    get:
      description: Mengarahkan browser pengguna ke halaman login SSO BPS Sumut OIDC
        provider atau mengembalikan auth URL
      parameters:
      - description: Jika false, mengembalikan URL JSON tanpa redirect 302
        in: query
        name: redirect
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "302":
          description: Redirect to SSO Provider
          schema:
            type: string
      summary: Inisiasi login SSO BPS Sumut
      tags:
      - Auth
  /auth/logout:
    get:
      description: Menghapus cookie sesi lokal dan mengarahkan ke Single Log Out SSO
        BPS Sumut
      parameters:
      - description: URL tujuan setelah logout selesai
        in: query
        name: post_logout_redirect_uri
        type: string
      - description: Jika false, mengembalikan URL JSON tanpa redirect
        in: query
        name: redirect
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "302":
          description: Redirect to SSO Logout
          schema:
            type: string
      summary: Single Log Out (SLO)
      tags:
      - Auth
    post:
      description: Menghapus cookie sesi lokal dan mengarahkan ke Single Log Out SSO
        BPS Sumut
      parameters:
      - description: URL tujuan setelah logout selesai
        in: query
        name: post_logout_redirect_uri
        type: string
      - description: Jika false, mengembalikan URL JSON tanpa redirect
        in: query
        name: redirect
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "302":
          description: Redirect to SSO Logout
          schema:
            type: string
      summary: Single Log Out (SLO)
      tags:
      - Auth
