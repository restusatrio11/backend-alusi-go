basePath: /api/v1
definitions:
  http.AskRequest:
    properties:
      question:
        type: string
    required:
    - question
    type: object
  http.ReorderRequest:
    properties:
      app_ids:
        items:
          type: integer
        type: array
    required:
    - app_ids
    type: object
  response.ErrorData:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorData'
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  response.StandardResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorData'
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  usecase.CategoryInput:
    properties:
      deskripsi:
        type: string
      ikon:
        type: string
      nama:
        type: string
      slug:
        type: string
      urutan:
        type: integer
    required:
    - nama
    type: object
  usecase.CreateAnnouncementInput:
    properties:
      app_id:
        type: integer
      ends_at:
        type: string
      is_active:
        type: boolean
      judul:
        type: string
      konten:
        type: string
      starts_at:
        type: string
      tipe:
        description: info, warning, maintenance, urgent
        type: string
    required:
    - judul
    - konten
    type: object
  usecase.CreateAppInput:
    properties:
      category_id:
        type: integer
      deskripsi:
        type: string
      ikon_url:
        type: string
      is_public:
        type: boolean
      kontak_admin:
        type: string
      nama:
        type: string
      pemilik:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      slug:
        type: string
      status_layanan:
        type: string
      target_pengguna:
        type: string
      url:
        type: string
      urutan:
        type: integer
    required:
    - category_id
    - nama
    - url
    type: object
  usecase.GuideInput:
    properties:
      judul:
        type: string
      konten:
        type: string
      urutan:
        type: integer
    required:
    - judul
    - konten
    type: object
  usecase.OpenAPICatalogResponse:
    properties:
      dataset:
        items:
          $ref: '#/definitions/usecase.OpenAPIMetadataItem'
        type: array
      description:
        type: string
      license:
        type: string
      publisher:
        type: string
      title:
        type: string
      total_items:
        type: integer
    type: object
  usecase.OpenAPIMetadataItem:
    properties:
      access_rights:
        type: string
      description:
        type: string
      identifier:
        type: string
      issued:
        type: string
      landing_page:
        type: string
      modified:
        type: string
      publisher:
        type: string
      service_status:
        type: string
      target_audience:
        type: string
      theme:
        type: string
      title:
        type: string
    type: object
  usecase.SubmitFeedbackInput:
    properties:
      app_id:
        type: integer
      kategori:
        description: kendala, saran, data
        type: string
      pesan:
        type: string
    required:
    - pesan
    type: object
  usecase.UpdateAnnouncementInput:
    properties:
      app_id:
        type: integer
      ends_at:
        type: string
      is_active:
        type: boolean
      judul:
        type: string
      konten:
        type: string
      starts_at:
        type: string
      tipe:
        type: string
    required:
    - judul
    - konten
    type: object
  usecase.UpdateAppInput:
    properties:
      aktif:
        type: boolean
      category_id:
        type: integer
      deskripsi:
        type: string
      ikon_url:
        type: string
      is_public:
        type: boolean
      kontak_admin:
        type: string
      nama:
        type: string
      pemilik:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      slug:
        type: string
      status_layanan:
        type: string
      target_pengguna:
        type: string
      url:
        type: string
      urutan:
        type: integer
    required:
    - category_id
    - nama
    - url
    type: object
  usecase.UpdateFeedbackStatusInput:
    properties:
      catatan_admin:
        type: string
      status:
        description: pending, in_progress, resolved, closed
        type: string
    required:
    - status
    type: object
host: localhost:8080
info:
  contact:
    email: bps1200@bps.go.id
    name: Tim Inovasi BPS Provinsi Sumatera Utara
    url: https://sumut.bps.go.id
  description: Backend RESTful API untuk Portal Aplikasi Terintegrasi BPS Provinsi
    Sumatera Utara.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://sumut.bps.go.id
  title: Portal Aplikasi BPS Provinsi Sumatera Utara (ALUSI) API
  version: 1.2.0
paths:
  /admin/analytics/disruptions:
    get:
      description: Mengambil riwayat insiden kendala operasional dan persentase uptime
        SLA per layanan (Admin)
      parameters:
      - description: Rentang hari ke belakang (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Rekapitulasi gangguan layanan dan SLA
      tags:
      - Admin - Analytics
  /admin/analytics/summary:
    get:
      description: Mengambil agregasi total pengguna, total aplikasi aktif, total
        klik, serta DAU dan MAU (Admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Ringkasan metrik eksekutif (KPI Rollup)
      tags:
      - Admin - Analytics
  /admin/analytics/top-apps:
    get:
      description: Mengambil daftar peringkat aplikasi terpopuler berdasarkan jumlah
        klik (Admin)
      parameters:
      - description: Rentang hari ke belakang (default 30)
        in: query
        name: days
        type: integer
      - description: Jumlah item ranking (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Ranking aplikasi paling sering diakses
      tags:
      - Admin - Analytics
  /admin/analytics/trends:
    get:
      description: Mengambil data tren grafik klik harian dan jumlah pengguna aktif
        unik (Admin)
      parameters:
      - description: Rentang hari ke belakang (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Tren trafik dan aktivitas harian
      tags:
      - Admin - Analytics
  /admin/announcements:
    get:
      description: Mengambil seluruh riwayat pengumuman baik yang aktif maupun nonaktif
        (Admin)
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah item per halaman (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Daftar seluruh pengumuman (Admin)
      tags:
      - Admin - Announcements
    post:
      consumes:
      - application/json
      description: Membuat pengumuman broadcast atau banner pemeliharaan baru (Admin)
      parameters:
      - description: Data pengumuman baru
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateAnnouncementInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Buat pengumuman baru
      tags:
      - Admin - Announcements
  /admin/announcements/{id}:
    delete:
      description: Menghapus pengumuman dari sistem (Admin)
      parameters:
      - description: ID Pengumuman
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Hapus pengumuman
      tags:
      - Admin - Announcements
    put:
      consumes:
      - application/json
      description: Memperbarui judul, pesan, tipe, atau masa tayang pengumuman (Admin)
      parameters:
      - description: ID Pengumuman
        in: path
        name: id
        required: true
        type: integer
      - description: Data perubahan pengumuman
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/usecase.UpdateAnnouncementInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Perbarui pengumuman
      tags:
      - Admin - Announcements
  /admin/apps:
    post:
      consumes:
      - application/json
      description: Menambahkan data aplikasi baru ke dalam katalog (Admin)
      parameters:
      - description: Data aplikasi baru
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateAppInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Tambah aplikasi baru
      tags:
      - Admin - Catalog
  /admin/apps/{id}:
    delete:
      description: Menonaktifkan aplikasi dari tampilan katalog pengguna (Admin)
      parameters:
      - description: ID Aplikasi
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Hapus (Soft Delete) aplikasi
      tags:
      - Admin - Catalog
    put:
      consumes:
      - application/json
      description: Memperbarui informasi metadata aplikasi yang sudah ada (Admin)
      parameters:
      - description: ID Aplikasi
        in: path
        name: id
        required: true
        type: integer
      - description: Data perubahan aplikasi
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/usecase.UpdateAppInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Perbarui data aplikasi
      tags:
      - Admin - Catalog
  /admin/apps/{id}/guides:
    post:
      consumes:
      - application/json
      description: Menambahkan panduan atau FAQ baru untuk sebuah aplikasi (Admin)
      parameters:
      - description: ID Aplikasi
        in: path
        name: id
        required: true
        type: integer
      - description: Data panduan baru
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/usecase.GuideInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Tambah panduan / FAQ aplikasi
      tags:
      - Admin - Guides
  /admin/apps/{id}/probe:
    post:
      description: Memaksa pemeriksaan langsung (live HTTP ping) pada endpoint health
        check aplikasi (Admin)
      parameters:
      - description: ID Aplikasi
        in: path
        name: id
        required: true
        type: integer
      produces:
