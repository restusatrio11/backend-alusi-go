        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.StandardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.StandardResponse'
      security:
      - BearerAuth: []
      summary: Trigger manual probe kesehatan aplikasi
      tags:
      - Admin - Monitoring
  /admin/apps/reorder:
    put:
      consumes:
      - application/json
      description: Memperbarui urutan sequence posisi tampilan katalog aplikasi (Admin)
      parameters:
      - description: Daftar ID aplikasi sesuai urutan baru
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/http.ReorderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
