root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main.exe"
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", ".agents", "migrations"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]
  exclude_regex = ["_test.go"]
  stop_on_error = true

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
